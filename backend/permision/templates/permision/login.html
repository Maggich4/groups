<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход в систему</title>

    <style>
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      .login-container {
        background: white;
        width: 100%;
        max-width: 400px;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
      }
      
      h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #1e293b;
      }
      
      .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 30px;
      }
      
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }
      
      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
      }
      
      input:focus {
        outline: none;
        border-color: #2563eb;
      }
      
      button {
        width: 100%;
        padding: 13px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }
      
      button:hover {
        background: #1d4ed8;
      }
      
      .error {
        color: #dc2626;
        margin-bottom: 15px;
        font-size: 14px;
      }
      
      .register-link {
        text-align: center;
        margin-top: 20px;
        color: #64748b;
      }
      
      a {
        color: #2563eb;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <h1>Добро пожаловать!</h1>

      <p class="subtitle">Войдите в свой аккаунт</p>

      <form method="POST">
        {% csrf_token %}

        {% if form.errors %}
          <div class="error">Неправильный логин или пароль.</div>
        {% endif %}

        <label>Логин</label>
        {{ form.username }}

        <label>Пароль</label>
        {{ form.password }}

        <button type="submit">Войти</button>
      </form>

      <div class="register-link">
        Нет аккаунта?
        <a href="{% url 'register' %}">Зарегистрироваться</a>
      </div>
    </div>
   
  </body>
</html>
